<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ιπποκράτης ο Κώος | Gallery</title>
  <meta name="description" content="Φωτογραφίες και βίντεο από τον σύλλογο Ιπποκράτης ο Κώος.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js"></script>
</head>
<body>
  <header class="header">
    <div class="wrap">
      <a class="logo" href="index.html"><span class="emblem" aria-hidden="true"></span>Ιπποκράτης ο Κώος</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Μενού">☰</button>
      <nav class="nav" id="main-nav" aria-label="Κύρια πλοήγηση">
        <a href="index.html">Αρχική</a>
        <a href="tmimata.html">Τμήματα</a>
        <a href="program.html">Πρόγραμμα</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="wrap">
        <h1>Gallery</h1>
        <p>Στιγμές από τις προπονήσεις και τους αγώνες μας.</p>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="filters" role="group" aria-label="Κατηγορία">
          <button type="button" data-tab="fotografies" aria-pressed="true">Φωτογραφίες</button>
          <button type="button" data-tab="video" aria-pressed="false">Βίντεο</button>
        </div>

        <div id="fotografies">
          <div class="filters" role="group" aria-label="Φίλτρο αθλήματος">
            <button type="button" data-filter="all" aria-pressed="true">Όλες</button>
            <button type="button" data-filter="rythmiki" aria-pressed="false">Ρυθμική</button>
            <button type="button" data-filter="enorgani" aria-pressed="false">Ενόργανη</button>
            <button type="button" data-filter="stivos" aria-pressed="false">Στίβος</button>
          </div>

          <div class="media-grid">
            <img class="media-item" data-group="rythmiki" src="images/rythmiki-9996.jpg" alt="Αθλήτρια ρυθμικής σε άλμα με κορδέλα" width="933" height="1400" loading="lazy">
            <img class="media-item" data-group="rythmiki" src="images/rythmiki-2282.jpg" alt="Αθλήτρια ρυθμικής με στεφάνι" width="933" height="1400" loading="lazy">
            <img class="media-item" data-group="rythmiki" src="images/rythmiki-9930.jpg" alt="Αθλήτρια ρυθμικής με μπάλα" width="933" height="1400" loading="lazy">
            <div class="media-empty" data-group="enorgani"><span class="ph">[Φωτογραφία ενόργανης]</span></div>
            <div class="media-empty" data-group="stivos"><span class="ph">[Φωτογραφία στίβου]</span></div>
          </div>
        </div>

        <div class="video-grid" id="video" hidden>
          <div class="media-empty media-empty-video"><span class="ph">[Βίντεο]</span></div>
          <div class="media-empty media-empty-video"><span class="ph">[Βίντεο]</span></div>
        </div>
      </div>
    </section>
  </main>

  <div class="call-bar">
    <a href="tel:+306946366190" aria-label="Κλήση στη Μαρία Λιαμακερού">Κλήση: Μαρία</a>
    <a href="tel:+306947206956" aria-label="Κλήση στην Εύα Στάκκου">Κλήση: Εύα</a>
  </div>

  <footer class="footer">
    <div class="wrap">Ιπποκράτης ο Κώος</div>
  </footer>

  <script>
    const tabs = document.querySelectorAll('[data-tab]');
    function showTab(name) {
      tabs.forEach((tab) => {
        const active = tab.dataset.tab === name;
        tab.setAttribute('aria-pressed', String(active));
        document.getElementById(tab.dataset.tab).hidden = !active;
      });
    }
    tabs.forEach((tab) => tab.addEventListener('click', () => showTab(tab.dataset.tab)));
    if (location.hash === '#video') showTab('video');

    const buttons = document.querySelectorAll('[data-filter]');
    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        const filter = button.dataset.filter;
        buttons.forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
        document.querySelectorAll('.media-grid [data-group]').forEach((item) => {
          item.hidden = filter !== 'all' && item.dataset.group !== filter;
        });
      });
    });
  </script>
</body>
</html>
